[server]
port = 50051
# bind = "" (기본). "0.0.0.0" 으로 LAN 공유, "127.0.0.1" 로 강제 로컬, 또는 특정 IP.
# 비우면 모드별 기본값: 사무실=0.0.0.0, standalone=127.0.0.1.
# CLI: --bind <addr>
tools_dir = "./tools"
# trace_dir = 미설정 시 $HOME/agent_trace
trace_grpc_port = 50053

# Standalone 모드 — 출장 시 노트북 단독 사용.
# Enabled=true 시 127.0.0.1 만 바인딩, Svelte UI 서빙, tools/trace 대신 Go 내장 파서 사용.
# CLI 플래그(--standalone)로도 켤 수 있다.
[standalone]
enabled = false
# db_path = 미설정 시 $HOME/.agent-standalone/agent.db. CLI: --db-path
# archive_base = "" (미설정 시 $HOME/.agent-standalone/archive).
#   /api/agent/upload/benchmark → <archive_base>/<remotePath>/<jobId>/{deviceId}_result.json
#   /api/agent/upload/trace     → <archive_base>/<remotePath>/<jobId>/{parquet, trace.log}
#   CLI: --archive-base /path/to/archive
# archive_base = "/data/agent-archive"

[minio]
endpoint = "localhost:9000"
access_key = "admin"
secret_key = "tka123tjd!"
bucket = "agent"
use_ssl = false

# tools_dir 안의 실제 바이너리 파일명 override.
# 예: fio 3.36 을 받아서 `tools/fio-3.36` 으로 저장했다면 fio = "fio-3.36"
# 비우면 도구 기본명을 사용한다 (fio, iozone, tiotest, iotest).
# bare 파일명만 허용 (`/`, `\` 거부).
# [tools]
# fio = "fio-3.36"
# iozone = "iozone-3.506"
# tiotest = "tiotest-0.4.3"
# iotest = "iotest"
