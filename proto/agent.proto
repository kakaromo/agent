syntax = "proto3";
package agent;
option go_package = "agent/pb";

service DeviceAgent {
  // Device Management
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc ConnectDevice(ConnectDeviceRequest) returns (ConnectDeviceResponse);
  rpc DisconnectDevice(DisconnectDeviceRequest) returns (DisconnectDeviceResponse);

  // Benchmarking
  rpc RunBenchmark(RunBenchmarkRequest) returns (RunBenchmarkResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  rpc SubscribeJobProgress(SubscribeJobProgressRequest) returns (stream JobProgress);
  rpc GetBenchmarkResult(GetBenchmarkResultRequest) returns (GetBenchmarkResultResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Scenario
  rpc RunScenario(RunScenarioRequest) returns (RunScenarioResponse);

  // Trace
  rpc StartTrace(StartTraceRequest) returns (StartTraceResponse);
  rpc StopTrace(StopTraceRequest) returns (StopTraceResponse);
  rpc GetTraceResult(GetTraceResultRequest) returns (GetTraceResultResponse);
  rpc GetTraceRawData(GetTraceRawDataRequest) returns (GetTraceRawDataResponse);
  // I/O 귀속 집계 — "이 IO 를 누가/무엇이 만들었나" (fsio_* 전용)
  rpc GetIoAttribution(GetIoAttributionRequest) returns (GetIoAttributionResponse);
  // VFS buffered read page-cache 통계 (fsio_read 형제 parquet 전용)
  rpc GetFsioReadStats(GetFsioReadStatsRequest) returns (GetFsioReadStatsResponse);

  // Upload
  rpc UploadTraceToMinio(UploadTraceRequest) returns (UploadTraceResponse);
  rpc UploadBenchmarkToMinio(UploadBenchmarkRequest) returns (UploadBenchmarkResponse);

  // Trace Archive — presigned URL 받아 nginx 경유 PUT (raw + realtime parquet)
  rpc UploadTraceArchive(UploadTraceArchiveRequest) returns (stream UploadTraceArchiveProgress);

  // Archive 대상 파일 메타 조회 — portal 이 init 시 정확한 file size/count 를 알고 presign 발급
  rpc GetArchiveFilesInfo(GetArchiveFilesInfoRequest) returns (GetArchiveFilesInfoResponse);

  // Monitoring
  rpc MonitorDevices(MonitorDevicesRequest) returns (stream DeviceMetrics);

  // App Macro (이벤트 녹화/재생 + OCR)
  rpc ListInstalledApps(ListInstalledAppsRequest) returns (ListInstalledAppsResponse);
  rpc StartRecording(StartRecordingRequest) returns (StartRecordingResponse);
  rpc StopRecording(StopRecordingRequest) returns (StopRecordingResponse);
  rpc ReplayMacro(ReplayMacroRequest) returns (ReplayMacroResponse);
  rpc TakeScreenshot(TakeScreenshotRequest) returns (TakeScreenshotResponse);
  rpc ScreenshotOcr(ScreenshotOcrRequest) returns (ScreenshotOcrResponse);
  rpc ListUiElements(ListUiElementsRequest) returns (ListUiElementsResponse);

  // APK management (번들 폴더 list, install, uninstall)
  rpc ListBundledApks(ListBundledApksRequest) returns (ListBundledApksResponse);
  rpc InstallApk(InstallApkRequest) returns (InstallApkResponse);
  rpc UninstallApk(UninstallApkRequest) returns (UninstallApkResponse);

  // Trace Reparse
  rpc ReparseTrace(ReparseTraceRequest) returns (ReparseTraceResponse);

  // Interactive shell (PTY) — bidi-streaming.
  // 첫 메시지는 반드시 ShellClientMsg.start (device_id, cols, rows) 이어야 한다.
  // 이후 input / resize 메시지로 양방향 통신. 종료 시 server 가 ShellServerMsg.exit 전송.
  rpc Shell(stream ShellClientMsg) returns (stream ShellServerMsg);
}

// ==================== Device ====================

enum DeviceState {
  DEVICE_STATE_UNKNOWN = 0;
  DEVICE_STATE_ONLINE = 1;
  DEVICE_STATE_OFFLINE = 2;
  DEVICE_STATE_BUSY = 3;
}

message DeviceInfo {
  string device_id = 1;
  string serial = 2;
  DeviceState state = 3;
  string android_version = 4;
  string model = 5;
  string board = 6;              // ro.product.board (e.g. "sun")
  string platform = 7;           // ro.board.platform (e.g. "sun")
  string hardware = 8;           // ro.hardware (e.g. "qcom")
  string cpu_abi = 9;            // ro.product.cpu.abi (e.g. "arm64-v8a")
  string build_id = 10;          // ro.build.display.id
  string manufacturer = 11;      // ro.product.manufacturer (e.g. "samsung")
  int32 sdk_version = 12;        // ro.build.version.sdk
}

message ListDevicesRequest {}
message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message ConnectDeviceRequest {
  string serial = 1;
}
message ConnectDeviceResponse {
  bool success = 1;
  string message = 2;
}

message DisconnectDeviceRequest {
  string serial = 1;
}
message DisconnectDeviceResponse {
  bool success = 1;
}

// ==================== Benchmark ====================

enum BenchmarkTool {
  BENCHMARK_TOOL_UNSPECIFIED = 0;
  BENCHMARK_TOOL_FIO = 1;
  BENCHMARK_TOOL_IOZONE = 2;
  BENCHMARK_TOOL_TIOTEST = 3;
  BENCHMARK_TOOL_IOTEST = 4;
}

enum JobState {
  JOB_STATE_UNKNOWN = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_PUSHING_TOOLS = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_COLLECTING = 4;
  JOB_STATE_COMPLETED = 5;
  JOB_STATE_FAILED = 6;
  JOB_STATE_PARTIALLY_FAILED = 7;
  JOB_STATE_CANCELLED = 8;
  JOB_STATE_REPARSING = 9;
}

message RunBenchmarkRequest {
  repeated string device_ids = 1;
  BenchmarkTool tool = 2;
  map<string, string> params = 3;
  string job_name = 4;
  string busy_policy = 5;         // "reject"(기본), "wait", "force"
  int32 retry_count = 6;          // 실패 시 재시도 횟수 (0=재시도 없음)
  int32 retry_delay_seconds = 7;  // 재시도 간격 (기본 60초)
}

message RunBenchmarkResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  JobState state = 2;
  int32 total_devices = 3;
  int32 completed_devices = 4;
  int32 failed_devices = 5;
  repeated DeviceJobStatus device_statuses = 6;
}

message DeviceJobStatus {
  string device_id = 1;
  JobState state = 2;
  string message = 3;
  int32 progress_percent = 4;
}

message SubscribeJobProgressRequest {
  string job_id = 1;
}

message JobProgress {
  string job_id = 1;
  string device_id = 2;
  JobState state = 3;
  string message = 4;
  int32 progress_percent = 5;
  string error = 6;
  map<string, double> metrics = 7;   // benchmark step 완료 시 결과 포함
  string raw_output = 8;             // benchmark step의 raw output
  int32 retry_attempt = 9;           // 현재 재시도 횟수 (0=첫 시도)
}

message GetBenchmarkResultRequest {
  string job_id = 1;
  string device_id = 2;
}

message GetBenchmarkResultResponse {
  repeated BenchmarkResult results = 1;
}

message BenchmarkResult {
  string device_id = 1;
  BenchmarkTool tool = 2;
  string raw_output = 3;
  map<string, double> metrics = 4;
  int64 started_at = 5;
  int64 finished_at = 6;
  bool success = 7;
  string error = 8;
  repeated TraceJobMapping trace_jobs = 9;

  // 시나리오 스텝 구간. behavior 구간별 IO 분석의 시간 축이 된다.
  repeated StepBoundary step_boundaries = 10;
}

message TraceJobMapping {
  string trace_job_id = 1;
  int32 step_index = 2;
  int32 loop_index = 3;       // 0 = no loop
  int32 repeat_index = 4;     // 1-based
  string trace_type = 5;      // "ufs", "block", "both", "fsio_ufs", "fsio_block"
}

// StepBoundary — 시나리오 스텝 하나의 실행 구간.
//
// **왜 TraceJobMapping 이 아니라 별도 메시지인가.** TraceJobMapping 은 trace_stop
// 스텝에서 잡당 1개 생긴다(어느 스텝이 트레이스를 멈췄나). 그런데 구간 분할이 필요한
// 것은 trace_start ~ trace_stop **사이에 실행된 모든 스텝**의 경계라 1:N 이다.
// 게다가 시나리오가 trace 를 안 멈추고 끝나면 TraceJobMapping 이 아예 안 생긴다
// (defer 정리 경로는 TRACE_STOP 라인을 안 찍는다) — 경계를 거기 얹을 수 없다.
message StepBoundary {
  int32 step_index = 1;
  int32 loop_index = 2;       // 0 = no loop
  int32 repeat_index = 3;     // 1-based
  string type = 4;            // 스텝 타입 ("launch_app", "scroll", ...) = 레인 라벨
  string label = 5;           // 사람이 읽는 이름 (비면 UI 가 type 을 쓴다)

  // 호스트 wall clock (ms). 로그·잡 시각과 대조할 때 쓴다.
  int64 started_at = 6;
  int64 finished_at = 7;

  // 기기 monotonic (초) — parquet `time` 과 **같은 축**이라 구간 질의에 그대로 쓴다.
  // clock offset 을 못 쟀으면 0 이고, 그때는 구간 분할이 비활성화된다.
  double started_mono = 8;
  double finished_mono = 9;

  bool success = 10;
  string error = 11;
}

message DeleteJobRequest {
  string job_id = 1;
}

message DeleteJobResponse {
  bool success = 1;
  string message = 2;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Scenario ====================

message ScenarioStep {
  string type = 1;                    // "benchmark", "shell", "cleanup", "sleep", "trace_start", "trace_stop", "condition", "app_macro", "install_apk", "uninstall_apk"
  BenchmarkTool tool = 2;            // benchmark일 때 사용
  map<string, string> params = 3;    // install_apk: {apk_filename:"foo.apk"}, uninstall_apk: {package_name:"com.x"}
  ConditionalBranch condition = 4;   // type="condition"일 때만 사용
  AppMacroConfig macro = 5;          // type="app_macro"일 때 사용
}

message AppMacroConfig {
  int64 macro_id = 1;                 // DB에 저장된 매크로 ID
  string macro_name = 2;
  repeated MacroEvent events = 3;     // 인라인 이벤트 (macro_id 없을 때)
  int32 source_width = 4;
  int32 source_height = 5;
  string package_name = 6;            // 앱 패키지명
  string clear_mode = 7;             // "none"(기본), "force_stop", "clear" (pm clear)
}

message ConditionalBranch {
  string metric_key = 1;             // 이전 step의 metrics 키 (예: "iops_read", "bw_write")
  string operator = 2;               // ">", "<", ">=", "<=", "==", "!=", "contains", "!contains"
  double threshold = 3;              // 숫자 비교 값 (예: 100000)
  int32 true_branch_step = 4;        // 조건 참일 때 이동할 step index
  int32 false_branch_step = 5;       // 거짓일 때 이동할 step index
  string source = 6;                 // "metric"(기본) 또는 "shell"
  string shell_command = 7;          // source="shell"일 때 실행할 명령어
  string extract_pattern = 8;        // 정규식으로 결과에서 값 추출 (예: "(\d+)%")
  string threshold_string = 9;       // 문자열 비교 값 (contains/!contains용)
  // 복합 조건: rules가 있으면 위 단일 필드 대신 rules를 평가
  repeated ConditionRule rules = 10;
  string logic = 11;                 // "and"(기본) 또는 "or"
}

message ConditionRule {
  string source = 1;                 // "metric" 또는 "shell"
  string metric_key = 2;
  string operator = 3;
  double threshold = 4;
  string threshold_string = 5;
  string shell_command = 6;
  string extract_pattern = 7;
}

message StepEdge {
  int32 from_step = 1;
  int32 to_step = 2;
  string label = 3;                  // "true", "false", "" (순차)
}

message ScenarioLoop {
  int32 start_step = 1;              // 시작 step index (0-based)
  int32 end_step = 2;                // 끝 step index (inclusive)
  int32 count = 3;                   // 반복 횟수
}

message RunScenarioRequest {
  repeated string device_ids = 1;
  string scenario_name = 2;
  repeated ScenarioStep steps = 3;
  repeated ScenarioLoop loops = 4;
  int32 repeat = 5;                  // 전체 시나리오 반복 (기본 1)
  string busy_policy = 6;           // "reject"(기본), "wait", "force"
  int32 retry_count = 7;            // 실패 시 재시도 횟수 (0=재시도 없음)
  int32 retry_delay_seconds = 8;    // 재시도 간격 (기본 60초)
  bool has_branching = 9;            // true면 DAG 실행 모드 (edges 사용)
  repeated StepEdge edges = 10;      // DAG 모드용 엣지 목록
  // 잡 전체에 걸리는 부가 옵션 (step 이 아니라 잡 단위).
  //   logcat=on            → logcat 수집 켜기 (on-device AI 측정)
  //   logcat_tags=A,B      → measure 모드. 없으면 explore(전체 버퍼)
  //   logcat_profile_id=3  → 저장된 AILogProfile 의 tags 를 쓴다 (REST 가 채움)
  map<string, string> params = 11;
}

message RunScenarioResponse {
  string job_id = 1;
}

// ==================== Trace ====================

message StartTraceRequest {
  string device_id = 1;
  string trace_type = 2;        // "ufs", "block", "both", "fsio_ufs", "fsio_block"
  int32 window_seconds = 3;     // parquet 윈도우 (기본 1초)
  string job_name = 4;

  // fsio 계열에서 VFS 레이어도 함께 수집할지 (기본 false).
  //
  // fsiotrace 는 `--only ufs|blk` 로 **출력 레이어**를 거른다(BPF 훅은 다 돈다).
  // 그런데 page-cache hit/miss 판정에 쓰는 fsio_read row —
  // `vfs_read:exit` / `readv:exit` / `mmap_fault:exit` — 는 전부 **VFS 레이어**라,
  // 기본 수집으로는 로그에 아예 안 찍혀 Page Cache 통계가 통째로 빈다.
  //
  // 켜면 `--only ufs,vfs` 가 되어 fsio_read 를 볼 수 있다. 대신 VFS row 만큼
  // 로그가 커지므로 기본값은 끔이다. ftrace 계열(ufs/block/both)에는 영향이 없다.
  bool include_vfs = 6;

  // 산출물을 둘 **부모** 디렉토리. 실제 산출물은 그 아래 <traceJobId>/ 에 들어간다.
  // 비면 기본 위치(trace_dir)를 쓴다.
  //
  // 시나리오가 이걸 채워 **그 잡 폴더 안**에 trace 를 모은다 — 예전엔 결과 JSON 과
  // trace 가 서로 다른 트리에, 서로 다른 ID 이름으로 흩어져 사람이 잇기 어려웠다.
  // trace manager 는 시나리오를 몰라도 되게 경로만 받는다.
  string output_dir = 5;
}

message StartTraceResponse {
  string job_id = 1;
}

message StopTraceRequest {
  string job_id = 1;
}

message StopTraceResponse {
  bool success = 1;
  string message = 2;
}

message TraceFilter {
  double start_time = 1;
  double end_time = 2;
  uint64 start_lba = 3;
  uint64 end_lba = 4;
  double min_dtoc = 5;
  double max_dtoc = 6;
  double min_ctoc = 7;
  double max_ctoc = 8;
  double min_ctod = 9;
  double max_ctod = 10;
  uint32 min_qd = 11;
  uint32 max_qd = 12;
  repeated uint32 cpu_list = 13;
  repeated string cmd_list = 14;
  repeated uint32 size_list = 15;
  repeated string action_list = 16;   // "send_req", "complete_rsp", "block_rq_issue", "block_rq_complete"

  // ── fsio_* 전용 cross-layer 필터 ──────────────────────────────────────────
  //
  // "dd 프로세스가 낸 IO 만", "이 파일에 대한 IO 만" 처럼 bpftrace 가 실어 온 귀속
  // 정보로 좁힌다. Attribution 행 클릭(드릴다운)이 이걸로 흘러 Charts/Statistics/
  // Raw Data/Attribution 이 **같은 모수**를 보게 된다.
  //
  // 해당 컬럼이 없는 parquet(ftrace 계열)에서는 서버가 조건을 조용히 skip 한다 —
  // 없는 컬럼을 참조하면 쿼리 자체가 깨지기 때문.
  repeated string comm_list    = 17;
  repeated uint32 pid_list     = 18;
  repeated string syscall_list = 19;
  repeated string fs_list      = 20;
  repeated string name_list    = 21;  // 정확 일치
  repeated uint64 ino_list     = 22;
  repeated uint32 lun_list     = 23;  // fsio_ufs
  repeated string dev_list     = 24;  // fsio_block — "major:minor" (예 "8:0")

  // 파일명 부분일치. name_list 는 목록에 있는 값만 고를 수 있어서, 상위 N 밖의
  // 파일을 찾으려면 이쪽이 필요하다.
  string name_contains = 25;

  // io_flags 비트 마스크 필터.
  //
  // ⚠ **문자열이다.** u64 를 JSON number 로 실으면 2^53 넘는 f2fs 힌트 비트가
  // 조용히 반올림된다 (raw 이벤트의 io_flags 를 문자열로 보내는 것과 같은 이유).
  // 빈 문자열 = 미적용.
  string io_flags_any  = 26;  // (io_flags & mask) != 0
  string io_flags_all  = 27;  // (io_flags & mask) == mask
  string io_flags_none = 28;  // (io_flags & mask) == 0
}

message GetTraceResultRequest {
  repeated string job_ids = 1;             // 여러 job의 parquet를 합쳐서 통계 (빈 경우 불가)
  TraceFilter filter = 2;
  repeated double latency_ranges_ms = 3;   // custom latency 구간 (예: [0.1, 0.5, 1, 5, 10, 50])
}

message GetTraceResultResponse {
  string job_id = 1;
  TraceStats stats = 2;
}

message TraceStats {
  int64 total_events = 1;          // send + complete 전체
  double duration_seconds = 2;
  LatencyStats dtoc = 3;
  LatencyStats ctod = 4;
  LatencyStats ctoc = 5;
  LatencyStats qd = 6;
  repeated CmdStats cmd_stats = 7;
  repeated LatencyHistogram latency_histograms = 8;
  repeated CmdSizeCount cmd_size_counts = 9;
  int64 continuous_count = 10;     // 연속성 true 개수 (send 기준)
  double continuous_ratio = 11;
  int64 aligned_count = 12;
  double aligned_ratio = 13;
  uint64 read_total_bytes = 14;
  uint64 write_total_bytes = 15;
  uint64 discard_total_bytes = 16;
  int64 send_count = 17;           // send/issue 이벤트 수 (연속성 분모)
  // UFS management 이벤트 집계 (fsio_ufs 전용, mgmt 행이 없으면 빈 배열).
  repeated MgmtStats mgmt_stats = 18;

  // read/write × 주소 연속성 분해. 판정은 **send 순서** 기준.
  //
  // ⚠ 위 continuous_count/ratio(필드 10/11)와 **값이 다르다.** 저건 방향 구분 없이
  // 직전 send 1개와만 비교해서, write 뒤의 read 는 LBA 가 이어져도 항상 false 다.
  // 이쪽은 read 끼리, write 끼리 **독립 체인**으로 본다. 두 수치를 같은 화면에
  // 놓을 때는 반드시 라벨로 갈라야 한다 — 안 그러면 "왜 연속성 숫자가 두 개고
  // 다르냐" 가 된다.
  repeated DirectionContiguityStats direction_contiguity = 19;

  // discard/flush 는 read 도 write 도 아니라 위 항목들에서 빠진다. 그래서 항목들의
  // count 합이 send_count 보다 작다. 화면이 "M건 중 N건 분류됨" 을 말할 수 있게
  // 분모를 함께 낸다 — 안 내면 그 차이가 버그로 보인다.
  int64 classified_send_count = 20;
}

// read/write × contiguous/discontiguous 한 칸.
//
// 최대 4행(read/write × cont/discont)이라 repeated 비용이 없고, 방향이 늘어나도
// 스키마가 안 바뀐다.
message DirectionContiguityStats {
  string direction = 1;              // "read" | "write"
  bool contiguous = 2;
  int64 count = 3;                   // 이 칸의 send 수
  // 이 방향 안에서의 비중(%). **실제로 묻는 질문**이 이거다 — "내 read 중 몇 %가 순차인가".
  double ratio_within_direction = 4;
  // 분류된 send 전체 대비 비중(%). 4항목 합이 100 이라 스택 막대로 그릴 수 있다.
  // 분모를 하나만 내면 화면에서 누군가 반드시 틀린 쪽으로 나눈다.
  double ratio_of_sends = 5;
  uint64 total_bytes = 6;            // 단위 환산 후 bytes
  double avg_request_bytes = 7;
}

// UFS management 이벤트(Query/TM UPIU, UIC) 집계.
//
// CmdStats 를 재사용하지 않는 이유 — total_size_bytes/continuous_* 가 mgmt 에 무의미하고,
// 반대로 total_time_ms 는 mgmt 에만 필요하다. mgmt 는 데이터 전송이 아니라 **링크 점유**라
// "hibern8 에 몇 초 있었나" 가 핵심 질문이고, 그건 합계 없이는 답이 안 나온다.
// 특히 idle 구간에서는 데이터 IO 가 거의 없고 mgmt(hibern8 enter/exit 쌍, BKOPS 폴링 등)가
// 행의 대부분을 차지해서, 이 집계가 그 구간의 사실상 유일한 산출물이 된다.
//
// 집계 축은 cmd 가 아니라 name(표시 이름) — mgmt 는 SCSI opcode 가 없어 cmd 축에서는
// 전부 '0x00' 으로 뭉친다.
message MgmtStats {
  // 표시 이름 — "Read Descriptor(geometry)" / "Abort Task" / "DME_HIBER_EXIT".
  // 파싱 시점에 구워둔 mgmt_name 컬럼 값.
  string name = 1;
  // 종류 — "query" | "tm" | "uic" | "other". UI 그룹핑용.
  string kind = 2;
  // 이 이름의 전체 행 수 (send + complete 양쪽).
  int64 count = 3;
  // 짝지어져 latency 가 계산된 건수 (complete 쪽만).
  int64 paired_count = 4;
  // **핵심 필드** — dtoc 합계(ms). 링크 점유 시간.
  // duration_seconds 와 비교하면 "관측 기간 중 몇 %" 가 나온다.
  double total_time_ms = 5;
  // 왕복 latency. 합계 중심 질문이 1순위지만 같은 스캔에서 나오므로 같이 채운다.
  LatencyStats dtoc = 6;
}

message LatencyStats {
  double min = 1;
  double max = 2;
  double avg = 3;
  double stddev = 4;
  double median = 5;
  double p99 = 6;
  double p999 = 7;
  double p9999 = 8;
  double p99999 = 9;
  double p999999 = 10;
  // 이 통계에 실제로 들어간 행 수. latency 컬럼은 0(=아직 완료 안 됨)을
  // 빼고 세므로 total_events 와 다르다 — 필터를 걸면 더 벌어진다.
  // 없으면 화면이 건수를 짐작해야 해서 필터 걸었을 때 틀린 수가 나온다.
  int64 count = 11;
}

message CmdStats {
  string cmd = 1;
  int64 count = 2;                 // send + complete 전체
  double ratio = 3;
  LatencyStats dtoc = 4;
  LatencyStats ctod = 5;
  LatencyStats ctoc = 6;
  LatencyStats qd = 7;
  uint64 total_size_bytes = 8;
  int64 continuous_count = 9;
  double continuous_ratio = 10;
  int64 send_count = 11;           // send/issue 이벤트 수
}

message LatencyHistogram {
  string cmd = 1;
  string latency_type = 2;     // "dtoc", "ctod", "ctoc"
  repeated LatencyBucket buckets = 3;
}

message LatencyBucket {
  double range_start_ms = 1;
  double range_end_ms = 2;
  int64 count = 3;
}

message CmdSizeCount {
  string cmd = 1;
  uint32 size = 2;
  int64 count = 3;
}

// ==================== I/O Attribution (귀속 집계) ====================
//
// 기존 stats 는 GROUP BY cmd 하나로 고정이라 "어떤 프로세스가/어떤 파일에/어떤 경로로"
// 라는 질문에 답할 수 없다. bpftrace 가 각 행에 붙인 cross-layer 메타를 집계 축으로
// 승격시킨다. CmdStats 를 재사용하지 않는 이유는 cmd 문자열 기반 read/write 분류가
// 프로세스명 같은 값에서 깨지고, 고카디널리티 축엔 정확 percentile 6종이 과하기 때문
// (여기선 p50/p99 2종만).

enum AttributionDim {
  ATTR_DIM_UNSPECIFIED = 0;
  ATTR_DIM_COMM        = 1;  // 프로세스 이름
  ATTR_DIM_PID         = 2;
  ATTR_DIM_TID         = 3;
  ATTR_DIM_SYSCALL     = 4;  // vfs_write / vfs_read / "-"
  ATTR_DIM_FS          = 5;  // ext4 / f2fs
  ATTR_DIM_FILE        = 6;  // name (이름을 아는 파일만)
  ATTR_DIM_INO         = 7;
  ATTR_DIM_FLOW        = 8;  // io_flags 파생 — GC/Journal/Writeback/Buffered 등
  ATTR_DIM_CMD         = 9;  // 기존 stats 와 동일 축 (비교용)
  ATTR_DIM_LUN         = 10; // UFS logical unit — LU 마다 LBA 주소공간 독립
  ATTR_DIM_DEVICE      = 11; // block device major:minor — 섹터 주소공간 독립
}

enum AttributionSort {
  ATTR_SORT_COUNT       = 0;
  ATTR_SORT_BYTES       = 1;
  // sum(dtoc) — "누가 장치 시간을 가장 많이 썼나". count 는 작은 metadata IO 를
  // 과대평가하므로 지연 원인 추적엔 이쪽이 맞다.
  ATTR_SORT_LATENCY_SUM = 2;
}

message GetIoAttributionRequest {
  repeated string job_ids = 1;
  TraceFilter filter = 2;
  repeated AttributionDim dims = 3;  // 여러 축을 한 번의 base 스캔으로 집계
  uint32 top_n = 4;                  // 축당 상위 N (기본 20, 서버가 200 으로 clamp)
  AttributionSort sort_by = 5;
}

message AttributionEntry {
  string key = 1;           // 표시값. 롤업 행은 "(other)", 빈 값은 "(none)"
  int64 count = 2;
  int64 send_count = 3;
  double ratio = 4;         // count / total_events * 100
  uint64 read_bytes = 5;
  uint64 write_bytes = 6;
  uint64 total_bytes = 7;
  double dtoc_sum_ms = 8;   // 이 키에 귀속된 총 장치 시간

  // (other) 롤업 행은 percentile 이 무의미하므로 비어 있다.
  // ⚠️ 클라이언트는 이걸 0 으로 폴백하면 안 된다 — 0ms p99 는 "빠름" 으로 읽혀서
  // unknown 의 정반대 의미가 된다. "—" 로 렌더할 것.
  optional double dtoc_avg_ms = 9;
  optional double dtoc_p50_ms = 10;
  optional double dtoc_p99_ms = 11;

  double dtoc_max_ms = 12;
  optional int64 distinct_files = 13;  // comm/pid/tid 축에서만 채워짐
  bool is_other = 14;
}

message AttributionGroup {
  AttributionDim dim = 1;
  repeated AttributionEntry entries = 2;
  // top-N 자르기 **전** 전체 카디널리티. UI 가 "전체 N개 중 상위 20개" 를 표시해
  // 롤업 사실을 숨기지 않게 한다.
  int64 distinct_keys = 3;
}

message GetIoAttributionResponse {
  int64 total_events = 1;
  repeated AttributionGroup groups = 2;
  // parquet 에 컬럼이 없어 건너뛴 축 — 에러 대신 "못 했다" 를 알린다.
  repeated AttributionDim unsupported_dims = 3;
}

// ============================================================================
// GetFsioReadStats — VFS buffered read page-cache 통계 (fsio_read 전용)
// ============================================================================
//
// 정본은 Rust `../trace/proto/log_processor.proto` 다. **응답 필드 번호를 그대로
// 맞췄다** — 요청만 agent 좌표계(job_ids)로 바꾼다. 필드 번호가 어긋나면 wire 에서
// 조용히 틀린 값이 붙는다.
//
// ⚠ CACHE_HIT_INFERRED 는 하드웨어 cache hit 이벤트가 아니다. "read 가 도는 동안 FS
//   page-fill 훅이 한 번도 안 불렸다" 는 **음성 증거** 기반 추론이다. 그래서 훅이
//   안 붙은 fs 의 행은 hit 이 아니라 UNKNOWN 으로 떨어진다(coverage).
//
// ⚠ **byte 단위 hit ratio 를 제공하지 않는다.** 일부 folio 만 uptodate 였던 부분 hit 도
//   fill>0 이라 miss 로 분류된다 — request 단위 판정이다. class 별 bytes 는
//   "그 class 로 분류된 request 가 반환한 바이트" 일 뿐 "캐시에 있던 바이트" 가 아니다.

message GetFsioReadStatsRequest {
  repeated string job_ids = 1;   // 이 잡들에 딸린 fsio_read 형제 parquet 을 본다
  TraceFilter filter = 2;
  uint32 top_n = 3;              // 파일별 상위 N (기본 20, 서버가 200 으로 clamp)
}

message FsioReadClassStats {
  // CACHE_HIT_INFERRED | CACHE_MISS | DIRECT_IO | EOF | ERROR | UNKNOWN
  string cache_class = 1;
  uint64 requests = 2;
  uint64 requested_bytes = 3;
  // ⚠ "캐시에 있던 바이트" 가 아니다 — 이 class 로 분류된 request 의 반환량이다.
  uint64 returned_bytes = 4;

  // dur_ns 가 실린 행만 센다. producer 가 진입을 못 본 exit 는 빠지므로 requests 보다
  // 작을 수 있다. 0 으로 채워 평균을 끌어내리지 않기 위해 표본 수를 따로 준다.
  uint64 duration_samples = 5;
  optional uint64 duration_avg_ns = 6;
  optional uint64 duration_p50_ns = 7;
  optional uint64 duration_p95_ns = 8;
  optional uint64 duration_p99_ns = 9;
}

message FsioReadFileStats {
  // 실제 경로 → "ino:N" → "(meta:<fs>)" → "(unknown)" 폴백.
  string key = 1;
  uint64 requests = 2;
  uint64 hit_requests = 3;
  uint64 miss_requests = 4;
  uint64 unknown_requests = 5;
  uint64 requested_bytes = 6;
  uint64 returned_bytes = 7;
  // ⚠ 훅 발화 횟수다. page 수도 byte 수도 아니다 (large folio·압축·merge).
  uint64 fill_units = 8;
  uint64 readahead_requests = 9;
  uint64 readahead_units = 10;
  uint64 total_duration_ns = 11;
}

message GetFsioReadStatsResponse {
  uint64 total_requests = 1;
  repeated FsioReadClassStats by_class = 2;

  // ⚠ **optional 이 의미가 있다.** 분모(hit+miss)가 0 이면 값을 안 싣는다.
  //   평문 double 이면 "전부 miss(0.0)" 와 "판정할 게 없음" 이 둘 다 0.0 으로 뭉개진다.
  //   분모에서 DIRECT_IO / EOF / ERROR / UNKNOWN 은 제외한다.
  optional double request_hit_ratio = 3;
  optional double request_miss_ratio = 4;
  optional double unknown_ratio = 5;

  uint64 fill_units = 6;
  uint64 readahead_requests = 7;
  uint64 readahead_units = 8;
  uint64 sync_ra_units = 9;
  uint64 short_reads = 10;
  uint64 duration_unknown = 11;

  repeated FsioReadFileStats top_files = 12;

  // 수집 품질 경고 (coverage 미부착 fs 등). **숨기지 말 것** — 부족한 근거를 모른 채
  // hit ratio 를 읽으면 cache 판정에서 특히 위험하다.
  repeated string quality_warnings = 13;

  string schema_version = 14;   // "fsio_read-v1"

  // mmap page fault — **위의 모든 값에서 제외된 별도 모집단**이다.
  FsioReadMmapStats mmap = 15;
}

// mmap page fault 요약.
//
// ⚠ **적중률 필드가 없는 것은 누락이 아니라 의도다.** fault-around 때문에 캐시에
//   있는 페이지는 fault 를 아예 안 내므로, 이 모집단은 사실상 miss 만 모여 있다.
//   hit/(hit+miss) 를 구하면 구조적으로 0% 에 가깝게 나오고, 그걸 "mmap 이 캐시를
//   못 맞춘다" 로 읽으면 완전히 틀린 결론이 된다. 진짜 분모(접근한 페이지 수)는
//   이 계층에 없다 — bpftrace 가 fault 만 보고 접근 전체를 못 본다.
//
// 그래서 read 통계와 **분모를 절대 섞지 않는다**. 섞으면 캐시는 그대로인데 mmap 을
// 쓴다는 이유만으로 hit ratio 가 떨어진다
// (실측: fio_mmap_sample.log 74.22% → 59.63%, fsio_mmap_sample.log 70.52% → 67.15%).
message FsioReadMmapStats {
  uint64 requests = 1;
  uint64 miss_requests = 2;
  uint64 fill_units = 3;
  uint64 duration_samples = 4;
  optional uint64 duration_avg_ns = 5;
  optional uint64 duration_p50_ns = 6;
  optional uint64 duration_p99_ns = 7;
}

message GetTraceRawDataRequest {
  repeated string job_ids = 1;             // 여러 job의 parquet를 합쳐서 조회
  TraceFilter filter = 2;
}

message GetTraceRawDataResponse {
  string job_id = 1;
  int64 total_events = 2;
  int64 sampled_events = 3;
  bool is_sampled = 4;
  repeated TraceEvent events = 5;
  // 조회된 잡의 trace_type ("ufs"/"block"/"both"/"ufscustom"/"fsio_ufs"/"fsio_block").
  //
  // 클라이언트가 컬럼 세트와 fsio 전용 UI 노출을 결정하는 데 쓴다. 시나리오 경유가
  // 아닌 단독 trace 실행에는 mappings 가 없어서, 이 값이 없으면 프론트가 타입을
  // 알 방법이 아예 없다.
  string trace_type = 6;
}

message TraceEvent {
  double time = 1;
  uint64 lba = 2;
  uint32 qd = 3;
  uint32 cpu = 4;
  double dtoc = 5;
  double ctod = 6;
  double ctoc = 7;
  string cmd = 8;
  uint32 size = 9;
  bool continuous = 10;
  string action = 11;          // "send_req"/"complete_rsp" (UFS) or "block_rq_issue"/"block_rq_complete" (Block)

  // ── 아래는 fsio_* (bpftrace) 전용. ftrace 산출물에서는 전부 비어 있다. ──
  //
  // Raw Data 표가 "이 IO 를 누가/어느 파일에" 를 행 단위로 보여주려면 필요하다.
  // 39개 is_* 불리언은 싣지 않는다 — io_flags 원본 u64 하나면 클라이언트가 같은
  // 비트 정의로 풀 수 있고, 그쪽이 전송량도 작고 비트 추가에도 안 깨진다.
  bool  aligned      = 12;
  uint64 line_number = 13;  // 원본 로그 라인 번호 (1-based)
  uint32 pid         = 14;
  uint32 tid         = 15;
  string comm        = 16;
  string syscall     = 17;  // "vfs_write" / "-" (VFS 안 거침)
  string fs          = 18;  // "ext4" / "f2fs"
  uint64 ino         = 19;
  string name        = 20;  // 풀패스 / "ino:N" / "(라벨)" — 뒤 둘은 파일명 부재의 표현
  uint64 io_flags    = 21;  // 39비트 마스크. 클라이언트가 이름으로 푼다

  // fsio_ufs 전용
  uint32 tag     = 22;
  uint32 opcode  = 23;  // SCSI opcode (parquet 은 u8)
  uint32 lun     = 24;  // 255 = 미상(LunUnknown). LU 마다 LBA 주소공간 독립
  uint32 groupid = 25;
  int32  hwqid   = 26;
  // UPIU 헤더 — send_req 에만 붙는다(응답 UPIU 는 stash 안 함). 없으면 미설정.
  optional uint32 txn        = 27;
  optional uint32 upiu_flags = 28;
  optional uint32 upiu_func  = 29;
  string upiu_attr           = 30;  // "Simple"/"Ordered"/"HoQ"/"ACA"
  optional uint32 upiu_cp    = 31;

  // fsio_block 전용
  uint32 devmajor = 32;
  uint32 devminor = 33;
  string rwbs     = 34;  // "WS"/"R"/"D" — 첫 글자가 종류, 뒤는 flag(F=FUA)
  string flags    = 35;  // ftrace trace flag string. bpftrace 엔 없어 빈 값
  uint32 extra    = 36;  // bpftrace 엔 없어 0

  // ── UFS management (Query/TM UPIU, UIC, exception) — fsio_ufs 전용 ──
  //
  // Raw Data 에 mgmt 행을 **일부러 남기기** 때문에 필요하다 (통계는 반대로 뺀다).
  // "hibern8 도는 동안 IO 가 멈췄다" 는 두 종류가 같은 타임라인에 있어야 보인다.
  //
  // cmd 필드에는 이미 mgmt_name 이 들어간다(서버가 CASE 로 치환). 아래는 그
  // 이름만으로는 부족한 경우 — Query 가 어느 IDN 을 건드렸는지, TM 이 성공했는지
  // (resp/status) — 를 행 단위로 확인하기 위한 원본 값이다.
  bool   is_mgmt   = 37;  // 이 행이 mgmt 인가. action 접두어로도 알 수 있지만 명시
  string mgmt_name = 38;  // 파싱 시점에 구워둔 표시 이름. cmd 와 같은 값
  optional uint32 upiu_resp     = 39;  // UPIU hdr[6] — 응답 방향 행의 성패
  optional uint32 upiu_status   = 40;  // UPIU hdr[7]
  optional uint32 query_opcode  = 41;  // tsf[0] — 0x01=Read Descriptor 등
  optional uint32 query_idn     = 42;  // tsf[1] — ⚠ 값 공간이 query_opcode 에 따라 다르다
  optional uint32 query_index   = 43;  // tsf[2]
  optional uint32 query_selector = 44; // tsf[3]
  optional uint32 uic_cmd       = 45;  // 0x16=HIBERNATE_ENTER, 0x17=EXIT 등

  // 미완결 IO 표시 — complete 를 끝내 못 받아 파서가 닫은 send.
  //
  // bpftrace 는 IRQ 재진입 가드 때문에 complete 를 구조적으로 소수 놓치고,
  // **IO 가 몰릴수록 그 비율이 오른다** (trace/parser/fsio_inflight.go).
  // 이 행의 dtoc 는 0 인데 그건 "0ms" 가 아니라 **"모름"** 이다. 표에서
  // 0ms 로 읽히면 "엄청 빠른 IO" 로 오해하므로 플래그로 구분한다.
  bool is_unfinished = 46;
}

// ==================== Upload to MinIO ====================

message UploadTraceRequest {
  repeated string job_ids = 1;     // trace job IDs to upload
  string remote_path = 2;          // MinIO path prefix (e.g. "test_2024/trace")
}

message UploadTraceResponse {
  bool success = 1;
  string message = 2;
  repeated string uploaded_files = 3;
}

message UploadBenchmarkRequest {
  string job_id = 1;               // benchmark/scenario job ID
  string remote_path = 2;          // MinIO path prefix (e.g. "test_2024/perf")
}

message UploadBenchmarkResponse {
  bool success = 1;
  string message = 2;
  repeated string uploaded_files = 3;
}

// ==================== Trace Archive (presigned multipart) ====================
//
// Portal 이 S3 multipart presigned URL 을 발급해서 보내고, agent 는 nginx 경유로 PUT.
// 단방향 원칙: agent → portal outbound 호출 없음. ETag 는 stream 으로 portal 에 보고.

message UploadTraceArchiveRequest {
  string job_id = 1;
  PresignedTarget raw = 2;                    // trace.log
  repeated PresignedTarget parquet_files = 3; // realtime parquet 파일들
}

message PresignedTarget {
  string local_path = 1;            // agent 디스크 절대 경로 (참조용 — agent 가 매핑)
  string trace_type = 2;            // "ufs" | "block" | "ufscustom" (parquet 만)
  // multipart 여부: parts 가 있으면 multipart, single_put_url 이 있으면 단일 PUT
  string upload_id = 3;             // S3 multipart uploadId
  repeated PresignedPart parts = 4; // 각 part 의 presigned PUT URL
  string single_put_url = 5;        // 작은 파일용 단일 PUT URL
  int64 total_bytes = 6;
  int64 part_size = 7;              // multipart 의 part 크기
}

message PresignedPart {
  int32 part_number = 1;            // 1-based
  string url = 2;                   // presigned PUT URL
}

message UploadTraceArchiveProgress {
  string job_id = 1;
  string current_file = 2;          // 표시용 (e.g. "trace.log", "realtime_ufs_001.parquet")
  int64 bytes_uploaded = 3;         // 누적
  int64 bytes_total = 4;
  int32 files_done = 5;
  int32 files_total = 6;
  // part 1개 완료 시 ETag 보고 — portal 이 모아서 S3 complete 호출
  optional CompletedPartReport completed_part = 7;
  optional bool finished = 8;       // 마지막 메시지에서 true
  optional string error = 9;
}

message CompletedPartReport {
  string local_path = 1;            // 어떤 파일의 part 인지 (raw 면 raw, parquet 면 해당 path)
  int32 part_number = 2;
  string etag = 3;
}

message GetArchiveFilesInfoRequest {
  string job_id = 1;
}

message GetArchiveFilesInfoResponse {
  string job_id = 1;
  int64  raw_size = 2;              // trace.log 바이트 수
  string raw_local_path = 3;        // base name (e.g. "trace.log")
  repeated ArchiveParquetInfo parquet_files = 4;
}

message ArchiveParquetInfo {
  string local_path = 1;            // base name (e.g. "realtime_ufs_001.parquet")
  string trace_type = 2;            // "ufs" | "block" | "ufscustom"
  int64  size = 3;
}

// ==================== Monitoring ====================

message MonitorDevicesRequest {
  repeated string device_ids = 1;
  uint32 interval_seconds = 2;
}

message DeviceMetrics {
  string device_id = 1;
  int64 timestamp = 2;
  CpuMetrics cpu = 3;
  MemoryMetrics memory = 4;
  DiskMetrics disk = 5;
  FilesystemInfo data_partition = 6;
}

message CpuMetrics {
  double usage_percent = 1;
  repeated double per_core_percent = 2;
}

message MemoryMetrics {
  uint64 total_kb = 1;
  uint64 available_kb = 2;
  uint64 used_kb = 3;
  double usage_percent = 4;
}

message DiskMetrics {
  uint64 read_bytes = 1;
  uint64 write_bytes = 2;
  uint64 read_ios = 3;
  uint64 write_ios = 4;
}

message FilesystemInfo {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
  uint64 available_bytes = 5;
  double usage_percent = 6;
}

// ==================== App Macro ====================

message MacroEvent {
  int64 t = 1;                         // 녹화 시작 기준 경과시간 (ms)
  string type = 2;                     // "tap", "tap_element", "text", "swipe", "key", "wait", "wait_until", "screenshot", "scroll_capture"
  int32 x = 3;                         // tap 좌표
  int32 y = 4;
  int32 x2 = 5;                        // swipe 끝 좌표
  int32 y2 = 6;
  int32 duration = 7;                  // swipe 지속시간 (ms)
  int32 keycode = 8;                   // key 이벤트
  int32 seconds = 9;                   // wait 대기 초
  string wait_method = 10;             // wait_until: "activity", "ui_text", "screen_stable"
  string wait_pattern = 11;            // wait_until: 감지할 문자열/정규식
  int32 timeout = 12;                  // wait_until: 최대 대기 (초)
  int32 poll_interval = 13;            // wait_until: 확인 간격 (초)
  string name = 14;                    // screenshot 이름
  string direction = 15;               // scroll_capture: "down", "up"
  int32 max_scrolls = 16;              // scroll_capture: 최대 스크롤 횟수
  int32 scroll_pause = 17;             // scroll_capture: 스크롤 후 대기 (초)
  string ocr_pattern = 18;             // scroll_capture: OCR 추출 정규식
  OcrRegion ocr_region = 19;           // screenshot/scroll_capture: OCR 영역 지정
  // 요소 기반 탭(tap_element) 셀렉터. 재생 시 uiautomator 트리에서 요소를 재탐색해
  // 중심을 탭한다. 우선순위: resource-id → text → content-desc.
  // 못 찾으면 폴백 좌표(위 x,y)로 탭한다 (게임/DRM 등 빈 트리 대응).
  string element_resource_id = 20;     // tap_element: resource-id 셀렉터
  string element_text = 21;            // tap_element: text 셀렉터
  string element_content_desc = 22;    // tap_element: content-desc 셀렉터
  string input_text = 23;              // text 이벤트: input text 로 입력할 문자열
  // 패턴 매칭 — 동적 콘텐츠(유튜브 피드/SNS/브라우저) 재현용.
  // text/content-desc 값이 매번 바뀌는 경우, 값 대신 규칙으로 매칭한다.
  // match_mode: "exact"(기본) | "contains" | "prefix" | "suffix" | "regex".
  //   비어있거나 "exact" 면 기존 동작(완전일치 후 부분일치 폴백) 유지.
  //   그 외 모드는 element_text/element_content_desc 를 패턴으로 해석한다.
  // element_index: 매칭된 요소가 여러 개일 때 N번째(0-based)를 고른다. 기본 0.
  // element_container_id: 지정 시 해당 resource-id 컨테이너 하위에서만 검색.
  string element_match_mode = 24;
  int32 element_index = 25;
  string element_container_id = 26;
}

message OcrRegion {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message ListInstalledAppsRequest {
  string device_id = 1;
}

message ListInstalledAppsResponse {
  repeated InstalledApp apps = 1;
}

message InstalledApp {
  string package_name = 1;       // com.antutu.ABenchMark
  string app_name = 2;           // AnTuTu Benchmark
}

// ==================== APK Management ====================

message ListBundledApksRequest {}

message ListBundledApksResponse {
  repeated BundledApk apks = 1;
}

message BundledApk {
  string filename = 1;           // tools/apks/<filename>
  int64 size_bytes = 2;
  string modified_at = 3;        // RFC3339
}

message InstallApkRequest {
  string device_id = 1;
  string apk_filename = 2;       // tools/apks/ 내부 파일명 (디렉토리 traversal 금지)
  bool reinstall = 3;            // pm install -r (기본 true 권장)
  bool grant_runtime_permissions = 4; // pm install -g
}

message InstallApkResponse {
  bool success = 1;
  string message = 2;            // adb stdout/stderr
  string package_name = 3;       // 추출 가능하면 채움 (best-effort)
}

message UninstallApkRequest {
  string device_id = 1;
  string package_name = 2;
  bool keep_data = 3;            // pm uninstall -k
}

message UninstallApkResponse {
  bool success = 1;
  string message = 2;
}

message StartRecordingRequest {
  string device_id = 1;
}

message StartRecordingResponse {
  bool success = 1;
  string session_id = 2;
}

message StopRecordingRequest {
  string device_id = 1;
  string session_id = 2;
}

message StopRecordingResponse {
  bool success = 1;
  repeated MacroEvent events = 2;
  int32 device_width = 3;
  int32 device_height = 4;
}

message ReplayMacroRequest {
  string device_id = 1;
  repeated MacroEvent events = 2;
  int32 source_width = 3;              // 녹화 시 해상도
  int32 source_height = 4;
  string job_id = 5;                   // 시나리오 job ID (진행 상황 보고용)
}

message ReplayMacroResponse {
  bool success = 1;
  string message = 2;
  map<string, string> ocr_results = 3; // screenshot name → OCR 텍스트
  map<string, double> metrics = 4;     // 추출된 숫자 메트릭 (OCR 정규식 매칭)
}

message TakeScreenshotRequest {
  string device_id = 1;
}

message TakeScreenshotResponse {
  bool success = 1;
  bytes image_data = 2;                // PNG 이미지 바이트
  int32 width = 3;
  int32 height = 4;
}

message ScreenshotOcrRequest {
  string device_id = 1;
  OcrRegion region = 2;                // null이면 전체 화면
  string extract_pattern = 3;          // 정규식 (빈 문자열이면 전체 텍스트)
}

message ScreenshotOcrResponse {
  bool success = 1;
  string full_text = 2;               // 전체 OCR 텍스트
  string extracted_value = 3;          // 정규식 매칭 결과
  bytes image_data = 4;               // 스크린샷 PNG
}

// 요소 기반 시나리오 빌더용 — 현재 화면의 클릭 가능 요소 목록 조회.
message ListUiElementsRequest {
  string device_id = 1;
  bool clickable_only = 2;             // true 면 clickable="true" 요소만 반환
}

message ListUiElementsResponse {
  bool success = 1;
  repeated UiElement elements = 2;
  int32 device_width = 3;              // 오버레이 좌표 변환용 화면 해상도
  int32 device_height = 4;
}

message UiElement {
  string resource_id = 1;
  string text = 2;
  string content_desc = 3;
  string class = 4;
  bool clickable = 5;
  int32 center_x = 6;                  // bounds 중심 (탭 목표)
  int32 center_y = 7;
  int32 bound_left = 8;                // bounds [x1,y1][x2,y2]
  int32 bound_top = 9;
  int32 bound_right = 10;
  int32 bound_bottom = 11;
  string container_id = 12;            // 가장 가까운 스크롤 컨테이너 id (자동 채움용)
}

// ==================== Trace Reparse ====================

message ReparseTraceRequest {
  string job_id = 1;
}

message ReparseTraceResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Shell (PTY) ====================

// 세션 시작 — 첫 메시지로 한 번만 전송한다.
message ShellStart {
  string device_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string term = 4; // 예: "xterm-256color" (선택, 비어있으면 server default)
}

// 사용자 키 입력 (raw bytes — xterm.js term.onData 가 보내는 UTF-8 sequence)
message ShellInput {
  bytes data = 1;
}

// 창 크기 변경 — server 가 pty 에 inline stty 명령 송신
message ShellResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// 클라이언트 → 서버
message ShellClientMsg {
  oneof payload {
    ShellStart  start  = 1;
    ShellInput  input  = 2;
    ShellResize resize = 3;
  }
}

// pty stdout/stderr 출력
message ShellOutput {
  bytes data = 1;
}

// 세션 종료 (process exit code)
message ShellExit {
  int32  code  = 1;
  string error = 2; // 비정상 종료 시 메시지 (선택)
}

// 서버 → 클라이언트
message ShellServerMsg {
  oneof payload {
    ShellOutput output = 1;
    ShellExit   exit   = 2;
  }
}
